name: WhatsApp daily logistics report

on:
  # התזמון האוטומטי כבוי כרגע לבקשת המשתמש (לא רוצים WhatsApp בינתיים).
  # כדי להפעיל מחדש: להחזיר את שני שורות ה-cron למטה (מכוסות UTC+2/UTC+3 של ישראל)
  # ולהוסיף את ה-secrets CALLMEBOT_PHONE ו-CALLMEBOT_APIKEY.
  # schedule:
  #   - cron: '0 12 * * *'
  #   - cron: '0 13 * * *'
  workflow_dispatch: {} # עדיין אפשר להריץ ידנית לבדיקה מטאב Actions

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node scripts/send-whatsapp-report.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          # בהרצה ידנית (workflow_dispatch) שולח תמיד, גם אם השעה בישראל שונה מ-15:00 - נוח לבדיקה.
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
