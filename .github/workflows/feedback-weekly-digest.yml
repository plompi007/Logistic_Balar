name: Weekly feedback digest

on:
  schedule:
    # ימי ראשון בלבד, שתי שעות UTC לכיסוי שעון קיץ/חורף בישראל (09:00 IDT/IST).
    # הסקריפט עצמו בודק שזה בדיוק יום ראשון 09:00 בישראל ומדלג בהרצה השנייה.
    # הדקה 7 (לא 0) בכוונה - ראו הערה בקובץ email-daily-report.yml.
    - cron: '7 6 * * 0'
    - cron: '7 7 * * 0'
  workflow_dispatch: {} # מאפשר הרצה ידנית לבדיקה מטאב Actions

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node scripts/send-feedback-digest.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FEEDBACK_EMAIL_TO: ${{ vars.FEEDBACK_EMAIL_TO }}
          # בהרצה ידנית (workflow_dispatch) שולח תמיד (אם יש דיווחים), גם אם היום/השעה לא תואמים - נוח לבדיקה.
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
