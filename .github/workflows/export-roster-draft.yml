name: Export roster draft from existing submissions

on:
  workflow_dispatch: {} # כלי עזר חד-פעמי/לפי צורך - מריצים ידנית כשרוצים לחדש את טיוטת הלוח

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node scripts/export-roster-draft.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/upload-artifact@v4
        with:
          name: roster-draft
          path: roster-draft.csv
