name: Email daily logistics report

on:
  # ה-schedule המובנה של GitHub Actions כבוי - במעקב חוזר הוא התעכב שעות (ולפעמים בכלל
  # לא רץ) גם אחרי שהוזז מהשעה העגולה, ככל הנראה בגלל תדירות/עדיפות נמוכה בתור של GitHub.
  # התזמון האמין בפועל הוא Google Apps Script חיצוני שקורא ל-workflow_dispatch (ראו תיעוד
  # הפרויקט) - זה גם למה FORCE_SEND למטה תמיד דלוק ב-workflow_dispatch: אין יותר בדיקת שעה
  # כפולה, ה-Apps Script כבר קובע מתי להפעיל.
  # schedule:
  #   - cron: '7 15 * * *'
  #   - cron: '7 16 * * *'
  workflow_dispatch: {} # מאפשר הרצה ידנית לבדיקה מטאב Actions

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node scripts/send-email-report.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          # בהרצה ידנית (workflow_dispatch) שולח תמיד, גם אם השעה בישראל שונה מ-18:00 - נוח לבדיקה.
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
