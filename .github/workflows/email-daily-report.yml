name: Email daily logistics report

on:
  schedule:
    # שתי הרצות ביום כדי לכסות שעון קיץ/חורף בישראל (UTC+2/UTC+3).
    # הסקריפט עצמו בודק שהשעה בישראל היא 18:00 בדיוק ומדלג בהרצה השנייה.
    # הדקה 7 (לא 0) בכוונה - GitHub עצמם ממליצים לא לתזמן בדיוק על השעה העגולה,
    # כי זה הזמן העמוס ביותר ב-Actions וגורם לעיכובים משמעותיים בהרצות מתוזמנות.
    - cron: '7 15 * * *'
    - cron: '7 16 * * *'
  workflow_dispatch: {} # מאפשר הרצה ידנית לבדיקה מטאב Actions

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node scripts/send-email-report.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          # בהרצה ידנית (workflow_dispatch) שולח תמיד, גם אם השעה בישראל שונה מ-18:00 - נוח לבדיקה.
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
