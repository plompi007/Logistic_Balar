<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בקשת דרישה לוגיסטית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">

  <div id="loginBox">
    <h2 style="margin:0;text-align:center;">כניסה למילוי הטופס</h2>
    <p style="color:var(--muted); font-size:0.85rem; text-align:center; margin:0;">יש להתחבר עם חשבון Google כדי להגיש דרישה</p>
    <button class="btn btn-primary" id="loginBtn">התחברות עם Google</button>
    <p id="loginError" style="color:#f2607a; display:none; margin:0; text-align:center; font-size:0.85rem;"></p>
  </div>

  <div id="formPanel" class="hidden">
  <header class="page-header">
    <h1>בקשת דרישה לוגיסטית</h1>
    <p>יש להגיש עד השעה 12:00 יום לפני הקורס</p>
    <p style="font-size:0.8rem; margin-top:8px;">מחובר/ת כ-<span id="userEmailLabel"></span> · <a href="#" id="logoutLink" style="color:var(--muted);">התנתקות</a></p>
  </header>

  <div id="successMsg">הדרישה נשלחה בהצלחה! תודה.</div>
  <div id="errorMsg"></div>

  <form id="reqForm">
    <div class="field">
      <label for="submitterName">שם המדריך *</label>
      <input type="text" id="submitterName" name="submitterName" required autocomplete="name">
    </div>

    <fieldset>
      <legend>פרטי הקורס</legend>
      <div class="field">
        <label for="courseName">שם הקורס *</label>
        <select id="courseName" name="courseName" required>
          <option value="" disabled selected>בחר/י קורס...</option>
          <option value="אווטה">אווטה</option>
          <option value="פלייקארט">פלייקארט</option>
          <option value="FPV">FPV</option>
          <option value="הגנמי">הגנמי</option>
          <option value="מטיס מבצעי">מטיס מבצעי</option>
          <option value="אחר">אחר</option>
        </select>
      </div>
      <div class="field hidden" id="courseNameOtherField">
        <label for="courseNameOther">שם הקורס (אחר) *</label>
        <input type="text" id="courseNameOther" name="courseNameOther" placeholder="נא לפרט את שם הקורס">
      </div>
      <div class="row">
        <div class="field">
          <label for="courseDate">תאריך הקורס *</label>
          <input type="date" id="courseDate" name="courseDate" required>
        </div>
        <div class="field">
          <label for="traineesCount">כמות חניכים</label>
          <select id="traineesCount" name="traineesCount">
            <option value="">בחר/י כמות...</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="startTime">שעת פתיחת הקורס</label>
          <input type="time" id="startTime" name="startTime">
        </div>
        <div class="field">
          <label for="endTime">שעת סיום הקורס</label>
          <input type="time" id="endTime" name="endTime">
        </div>
      </div>
      <div class="field checkbox-field">
        <input type="checkbox" id="needsClassroom" name="needsClassroom">
        <label for="needsClassroom">יש צורך בכיתה</label>
      </div>
      <div class="field hidden" id="classroomHoursField">
        <label for="classroomHours">שעות כיתה</label>
        <input type="text" id="classroomHours" name="classroomHours" placeholder="לדוגמה: 08:00-10:00">
      </div>
    </fieldset>

    <fieldset>
      <legend>אמל"ח נדרש</legend>
      <p class="hint">יש לפרט כמות מדוייקת של כלל האמצעים</p>
      <div id="equipmentItems"></div>
      <button type="button" class="btn btn-secondary add-item-btn" data-target="equipmentItems">+ הוספת פריט</button>
    </fieldset>

    <fieldset>
      <legend>ציוד לוגיסטי נדרש</legend>
      <p class="hint">יש לפרט כמות מדוייקת</p>
      <div id="logisticsItems"></div>
      <button type="button" class="btn btn-secondary add-item-btn" data-target="logisticsItems">+ הוספת פריט</button>
    </fieldset>

    <div class="field">
      <label for="notes">הערות</label>
      <textarea id="notes" name="notes"></textarea>
    </div>

    <button type="submit" class="btn btn-primary btn-block">שליחת הדרישה</button>
  </form>

  <p style="text-align:center; margin-top: 18px;">
    <a href="admin.html" style="color: var(--muted); font-size: 0.85rem;">כניסת מנהל</a>
  </p>
  </div>
</div>

<template id="itemRowTemplate">
  <div class="item-row">
    <input type="text" class="item-name" placeholder="שם הפריט">
    <input type="text" class="item-qty" placeholder="כמות">
    <button type="button" class="btn btn-danger remove-item-btn">הסר</button>
  </div>
</template>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/form.js"></script>
</body>
</html>
